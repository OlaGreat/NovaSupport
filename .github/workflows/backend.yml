name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novasupport_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novasupport_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/novasupport_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/novasupport_test
      NODE_ENV: test
      SKIP_HORIZON_VALIDATION: "true"
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Validate database migrations
        run: |
          set +e
          DRIFT=$(npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-migrations prisma/migrations \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code 2>&1)
          DRIFT_EXIT=$?
          set -e
          echo "::group::Schema drift diff output"
          echo "$DRIFT"
          echo "::endgroup::"
          if [ $DRIFT_EXIT -ne 0 ]; then
            echo ""
            echo "============================================"
            echo "  ❌ MIGRATION VALIDATION FAILED"
            echo "============================================"
            echo ""
            echo "  Drift detected — see diff output above."
            echo ""
            echo "  To fix: create a new migration:"
            echo "    cd backend"
            echo "    npx prisma migrate dev --name describe_your_changes"
            echo ""
            exit 1
          fi
          echo "✅ Schema and migrations are in sync."
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run backend tests
        run: npm run test

      - name: Lint backend
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        run: npx @sentry/cli releases files "$SENTRY_RELEASE" upload-sourcemaps ./dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: novasupport
          SENTRY_PROJECT: novasupport-backend
          SENTRY_RELEASE: ${{ github.sha }}
